name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      # A test file that git does not track is a test CI never runs, while the
      # local suite still passes because Go does not consult git. An unanchored
      # "tlsanalyzer" pattern in .gitignore matched the cmd/tlsanalyzer directory
      # and hid its whole test file for a full release.
      - name: Every test file is tracked
        run: |
          untracked=$(git ls-files --others -- '*_test.go')
          if [ -n "$untracked" ]; then
            echo "These test files are not tracked by git, so CI never runs them:"
            echo "$untracked"
            echo
            echo "Check .gitignore for a pattern that matches them:"
            echo "$untracked" | xargs -r git check-ignore -v || true
            exit 1
          fi
          echo "All $(git ls-files -- '*_test.go' | wc -l | tr -d ' ') test files are tracked."

      - name: Verify dependencies
        run: go mod verify

      - name: Build
        run: go build -v ./...

      - name: Run go vet
        run: go vet ./...

      - name: Check formatting
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "Code is not formatted. Run 'gofmt -s -w .'"
            gofmt -s -l .
            exit 1
          fi

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.txt
          flags: unittests
        continue-on-error: true

  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          args: --timeout=5m
        continue-on-error: true
