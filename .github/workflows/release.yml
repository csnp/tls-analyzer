name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
          - goos: windows
            goarch: amd64
            suffix: windows-amd64
            ext: .exe

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          go build -ldflags="-s -w \
            -X main.version=${VERSION} \
            -X main.commit=${GITHUB_SHA} \
            -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o tlsanalyzer${{ matrix.ext }} ./cmd/tlsanalyzer

      - name: Create archive
        run: |
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip tlsanalyzer-${{ matrix.suffix }}.zip tlsanalyzer${{ matrix.ext }}
          else
            tar -czvf tlsanalyzer-${{ matrix.suffix }}.tar.gz tlsanalyzer${{ matrix.ext }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tlsanalyzer-${{ matrix.suffix }}
          path: tlsanalyzer-${{ matrix.suffix }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Releases up to 0.3.0 carried five archives and nothing else, so a
      # downloaded archive could not be checked against anything. Names are
      # recorded without their directory prefix, so a user who downloads the
      # archives and this file into one directory can run
      # "shasum -a 256 -c checksums.txt" directly.
      - name: Generate checksums
        working-directory: artifacts
        run: |
          find . -type f \( -name '*.tar.gz' -o -name '*.zip' \) | sort | while read -r archive; do
            ( cd "$(dirname "$archive")" && sha256sum "$(basename "$archive")" )
          done > ../checksums.txt
          echo "Published checksums:"
          cat ../checksums.txt
          if [ "$(wc -l < ../checksums.txt)" -lt 5 ]; then
            echo "Expected a checksum for each of the five archives"
            exit 1
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/**/*
            checksums.txt
          generate_release_notes: true
